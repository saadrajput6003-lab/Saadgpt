<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#070406"/>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#27101a" stroke-width="2"/>
  
  <!-- Outer Hexagonal / Spark Geometry -->
  <g filter="url(#neon)">
    <!-- Stylized S & Neural Star -->
    <path d="M 256 96 L 350 176 L 320 270 L 256 310 L 192 270 L 162 176 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Central Modern S Monogram -->
    <path d="M 310 190 C 310 160 286 142 256 142 C 224 142 200 162 200 192 C 200 240 312 230 312 300 C 312 338 284 360 252 360 C 216 360 194 336 192 305" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Core Spark / Sparkle Accent -->
    <circle cx="256" cy="246" r="8" fill="#ffffff" filter="url(#neon)"/>
    <circle cx="370" cy="140" r="6" fill="#fb7185"/>
    <circle cx="142" cy="140" r="6" fill="#fb7185"/>
    <circle cx="256" cy="400" r="6" fill="#fb7185"/>
  </g>
</svg>
